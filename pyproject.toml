[project]
name = "bountyhunter"
version = "0.7.0"
description = "Linux desktop-style workspace for authorized bug bounty work"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hax1ng" }]
keywords = ["bug-bounty", "hackerone", "security", "nicegui", "multi-agent", "ai-agents"]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "pydantic-ai>=2.37,<3",
    "openai>=3.6,<4",
    "anthropic>=1.0,<2",
    "nicegui>=2.21",
    "typer>=0.12",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
native = [
    "pywebview>=5.0",
]

[project.urls]
Homepage = "https://github.com/hax1ng/bounty-hunter"
Repository = "https://github.com/hax1ng/bounty-hunter"
Issues = "https://github.com/hax1ng/bounty-hunter/issues"
Changelog = "https://github.com/hax1ng/bounty-hunter/blob/main/CHANGELOG.md"

[project.scripts]
bountyhunter = "bountyhunter.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bountyhunter"]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
